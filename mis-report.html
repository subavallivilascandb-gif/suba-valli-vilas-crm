<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suba Valli Vilas | Monthly Review Meeting (MRM) &amp; MIS Report</title>
  <link rel="icon" type="image/png" href="svv-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="governance-shared.css">
  <style>
    /* ==========================================================================
       SUBA VALLI VILAS - EXECUTIVE C&B MIS REPORT STYLESHEET
       ========================================================================== */

    /* Filter Controls Deck */
    .filter-deck-bar {
      background: #FFFFFF;
      border: 1px solid var(--svv-border-gold);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .filter-btn-group {
      display: inline-flex;
      background: #F4EFE6;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--svv-border-gold);
      flex-wrap: wrap;
    }
    .filter-btn {
      border: none;
      background: transparent;
      padding: 7px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #555;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, var(--svv-maroon) 0%, #3F0202 100%);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(88, 5, 5, 0.2);
    }

    /* TOP EXECUTIVE KPI SUMMARY STRIP (User Requested) */
    .top-kpi-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .top-kpi-card {
      background: #FFFFFF;
      border: 1px solid var(--svv-border);
      border-radius: 10px;
      padding: 14px 16px;
      border-top: 3.5px solid var(--svv-maroon);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      position: relative;
      transition: transform 0.15s ease;
    }
    .top-kpi-card:hover {
      transform: translateY(-2px);
    }
    .top-kpi-card.kpi-gold { border-top-color: var(--svv-gold); }
    .top-kpi-card.kpi-green { border-top-color: #15803D; }
    .top-kpi-card.kpi-blue { border-top-color: #2563EB; }
    .top-kpi-card.kpi-purple { border-top-color: #7C3AED; }
    .top-kpi-card.kpi-amber { border-top-color: #D97706; }

    .top-kpi-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .top-kpi-label {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--svv-muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .top-kpi-icon {
      font-size: 1.15rem;
    }
    .top-kpi-val {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--svv-text);
      line-height: 1.1;
      margin: 4px 0 2px;
    }
    .top-kpi-sub {
      font-size: 0.74rem;
      color: var(--svv-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Page Canvas for Print & Screen */
    .mis-page {
      background: #FFFFFF;
      border: 1px solid var(--svv-border);
      border-radius: 14px;
      padding: 34px 40px;
      margin-bottom: 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      position: relative;
      box-sizing: border-box;
      break-inside: avoid;
    }
    .cover-page {
      background: linear-gradient(145deg, #1E293B 0%, #0F172A 100%);
      color: #FFFFFF;
      border: 2px solid var(--svv-gold);
      text-align: center;
      padding: 70px 40px;
    }
    .cover-card {
      max-width: 680px;
      margin: 0 auto;
    }
    .cover-brand {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      color: #FFFDF9;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .cover-tagline {
      font-size: 0.9rem;
      color: var(--svv-gold);
      letter-spacing: 1.5px;
      font-weight: 700;
    }
    .cover-divider {
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--svv-gold), transparent);
      margin: 22px auto;
    }
    .cover-title {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      color: #FFFFFF;
      margin-bottom: 10px;
    }
    .cover-period {
      font-size: 1.05rem;
      color: #E2E8F0;
      margin-bottom: 24px;
    }
    .cover-meta {
      font-size: 0.82rem;
      color: #94A3B8;
      line-height: 1.6;
    }

    /* Page Header */
    .page-top-hdr {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid var(--svv-gold);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .page-tag {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--svv-gold-dark);
    }
    .page-sec-title {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      color: var(--svv-maroon);
      margin: 0;
    }

    /* Summary Hero */
    .summary-hero-card {
      background: #FDFBF7;
      border: 1px solid var(--svv-border-gold);
      border-radius: 12px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 20px;
    }
    .health-circle {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 3.5px solid #15803D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(21, 128, 61, 0.15);
    }
    .health-num {
      font-size: 1.8rem;
      font-weight: 800;
      color: #15803D;
      line-height: 1;
    }
    .health-den {
      font-size: 0.72rem;
      color: var(--svv-muted);
    }
    .health-head {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      color: var(--svv-maroon);
      margin-bottom: 4px;
    }
    .health-sub {
      font-size: 0.88rem;
      color: var(--svv-muted);
      line-height: 1.5;
    }

    /* Section Cards */
    .section-card {
      background: #FFFFFF;
      border: 1px solid var(--svv-border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 18px;
      break-inside: avoid;
    }

    /* Grid Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }
    @media (max-width: 768px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    /* Conversion Funnel */
    .funnel-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 620px;
      margin: 0 auto 16px;
    }
    .funnel-step {
      background: #FDFBF7;
      border: 1px solid var(--svv-border-gold);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .funnel-step.highlight-step {
      background: #F0FDF4;
      border-color: #86EFAC;
    }
    .funnel-step-icon {
      font-size: 1.8rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      flex-shrink: 0;
    }
    .funnel-step-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--svv-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .funnel-step-val {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--svv-maroon);
    }
    .funnel-step-sub {
      font-size: 0.78rem;
      color: var(--svv-muted);
    }
    .funnel-arrow {
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--svv-gold-dark);
      padding: 2px 0;
    }
    .funnel-alert-banner {
      background: #FFFDF4;
      border: 1px solid var(--svv-gold);
      border-radius: 8px;
      padding: 10px 16px;
      text-align: center;
      font-size: 0.88rem;
      color: var(--svv-maroon);
      margin-bottom: 18px;
    }

    /* HOURLY TRAFFIC HEATMAP */
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 8px;
      margin: 12px 0;
    }
    .heatmap-cell {
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
      border: 1px solid #E2E8F0;
      transition: transform 0.15s ease;
    }
    .heatmap-cell:hover {
      transform: scale(1.04);
    }
    .heatmap-time {
      font-size: 0.68rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 4px;
    }
    .heatmap-count {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0F172A;
      line-height: 1;
    }
    .heatmap-share {
      font-size: 0.65rem;
      color: #64748B;
      margin-top: 3px;
    }
    .heat-peak {
      background: #FEF2F2 !important;
      border-color: #F87171 !important;
    }
    .heat-peak .heatmap-count {
      color: #B91C1C !important;
    }
    .heat-high {
      background: #FFFBEB !important;
      border-color: #FCD34D !important;
    }
    .heat-med {
      background: #F0FDF4 !important;
      border-color: #86EFAC !important;
    }
    .heat-low {
      background: #F8FAFC !important;
      border-color: #E2E8F0 !important;
    }

    /* DAY OF WEEK BARS */
    .dow-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    @media (max-width: 600px) {
      .dow-grid { grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); }
    }
    .dow-col {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 140px;
    }
    .dow-col.dow-peak {
      background: #FFFDF4;
      border-color: var(--svv-gold);
    }
    .dow-bar-track {
      width: 22px;
      height: 70px;
      background: #E2E8F0;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      margin: 6px 0;
      overflow: hidden;
    }
    .dow-bar-fill {
      width: 100%;
      background: linear-gradient(180deg, var(--svv-gold) 0%, var(--svv-maroon) 100%);
      border-radius: 4px;
      transition: height 0.3s ease;
    }
    .dow-day-name {
      font-size: 0.72rem;
      font-weight: 800;
      color: #334155;
    }
    .dow-count {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--svv-maroon);
    }

    /* HORIZONTAL DISTRIBUTION PROGRESS BARS */
    .dist-row {
      margin-bottom: 10px;
    }
    .dist-row-hdr {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .dist-track {
      height: 8px;
      background: #F1F5F9;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
    }
    .dist-fill {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--svv-maroon) 0%, var(--svv-gold) 100%);
    }

    /* STRATEGIC INSIGHT BOXES */
    .strategic-box {
      background: #FFFDF7;
      border-left: 4px solid var(--svv-gold);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.88rem;
      color: #334155;
      line-height: 1.6;
      margin-bottom: 14px;
    }
    .strategic-box strong {
      color: var(--svv-maroon);
    }

    /* SENTIMENT TILES */
    .sentiment-cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .sentiment-tile {
      border-radius: 10px;
      padding: 14px 16px;
      text-align: center;
    }
    .sentiment-green { background: #E8F8F0; border: 1px solid #86EFAC; color: #15803D; }
    .sentiment-neutral { background: #F8FAFC; border: 1px solid #CBD5E1; color: #334155; }
    .sentiment-red { background: #FEF2F2; border: 1px solid #FCA5A5; color: #B91C1C; }
    .sentiment-tile-title { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.5px; }
    .sentiment-tile-val { font-size: 1.8rem; font-weight: 800; margin: 3px 0; }
    .sentiment-tile-sub { font-size: 0.75rem; opacity: 0.85; }

    /* VOICE OF CUSTOMER (ELABORATE CARDS) */
    .voc-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
      break-inside: avoid;
    }
    .voc-card.voc-bridal {
      border-left: 4px solid var(--svv-gold);
      background: #FFFDF9;
    }
    .voc-card.voc-staff {
      border-left: 4px solid #15803D;
      background: #F0FDF4;
    }
    .voc-card.voc-heritage {
      border-left: 4px solid var(--svv-maroon);
      background: #FDFBF7;
    }
    .voc-card.voc-concern {
      border-left: 4px solid #DC2626;
      background: #FEF2F2;
    }
    .voc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .voc-user {
      font-weight: 700;
      font-size: 0.88rem;
      color: #1E293B;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .voc-quote {
      font-style: italic;
      color: #334155;
      font-size: 0.86rem;
      line-height: 1.5;
      margin: 6px 0 8px;
    }
    .voc-action-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: #F1F5F9;
      color: #475569;
    }

    /* TABLES */
    .mis-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin: 10px 0;
    }
    .mis-table th {
      background: #F8FAFC;
      color: var(--svv-maroon);
      font-weight: 800;
      padding: 10px 12px;
      border-bottom: 2px solid var(--svv-gold);
      text-align: left;
    }
    .mis-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #E2E8F0;
      color: #334155;
    }
    .mis-table tr:hover {
      background: #FFFDF9;
    }

    /* RECOVERY PIPELINE */
    .recovery-flow-card {
      background: #FAF8F5;
      border: 1px solid var(--svv-border-gold);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 620px;
      margin: 0 auto;
    }
    .recovery-step {
      background: #FFFFFF;
      border: 1px solid var(--svv-border);
      border-radius: 8px;
      padding: 12px 16px;
      text-align: center;
    }

    /* WINS & ATTENTION */
    .wins-attention-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 14px;
    }
    @media (max-width: 768px) {
      .wins-attention-row { grid-template-columns: 1fr; }
    }
    .wins-box {
      background: #F0FDF4;
      border: 1px solid #86EFAC;
      border-radius: 10px;
      padding: 14px 18px;
    }
    .wins-box h4 { color: #15803D; margin-bottom: 6px; font-size: 0.9rem; }
    .wins-box ul { padding-left: 18px; font-size: 0.84rem; color: #166534; line-height: 1.55; margin: 0; }

    .attention-box {
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      border-radius: 10px;
      padding: 14px 18px;
    }
    .attention-box h4 { color: #B91C1C; margin-bottom: 6px; font-size: 0.9rem; }
    .attention-box ul { padding-left: 18px; font-size: 0.84rem; color: #991B1B; line-height: 1.55; margin: 0; }

    /* ==========================================================================
       PRINT MEDIA QUERY (STRICT A4 ALIGNMENT - ZERO BLANK PAGES)
       ========================================================================== */
    @page {
      size: A4 portrait;
      margin: 10mm 12mm;
    }
    @media print {
      body {
        background: #FFFFFF !important;
        color: #000000 !important;
        font-size: 9.5pt !important;
      }
      .gov-top-bar, .filter-deck-bar, .no-print, button, input {
        display: none !important;
      }
      .gov-main {
        padding: 0 !important;
        max-width: 100% !important;
      }
      .top-kpi-strip {
        margin-bottom: 16px !important;
        grid-template-columns: repeat(6, 1fr) !important;
        gap: 6px !important;
      }
      .top-kpi-card {
        padding: 8px 10px !important;
        box-shadow: none !important;
        border: 1px solid #CBD5E1 !important;
      }
      .top-kpi-val {
        font-size: 1.25rem !important;
      }
      .mis-page {
        border: none !important;
        box-shadow: none !important;
        padding: 10mm 8mm !important;
        margin: 0 !important;
        page-break-after: always !important;
        break-after: page !important;
        min-height: auto !important;
      }
      .mis-page:last-child {
        page-break-after: avoid !important;
        break-after: avoid !important;
      }
      .cover-page {
        background: #1E293B !important;
        color: #FFFFFF !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .section-card, .voc-card, .wins-box, .attention-box, .funnel-container {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }
  </style>
</head>
<body>

  <!-- UNIFIED TOP NAVIGATION -->
  <header class="gov-top-bar">
    <div class="gov-bar-inner">
      <a href="crm-hub.html" class="gov-brand">
        <div class="gov-cb-badge" title="Consulting & Beyond (C&B)">
          <img src="cb-logo.png" alt="C&B Consulting & Beyond">
        </div>
        <div class="gov-logo-badge" title="Suba Valli Vilas Jewellery">
          <img src="svv-logo.png" alt="Suba Valli Vilas">
        </div>
        <div>
          <div class="gov-brand-title">SUBA VALLI VILAS</div>
          <div class="gov-brand-sub">CRM GOVERNANCE &amp; MANAGEMENT SUITE</div>
        </div>
      </a>

      <nav class="gov-nav-links">
        <a href="index.html" class="gov-nav-link nav-home"><span>🏠</span> Main App</a>
        <a href="crm-hub.html" class="gov-nav-link"><span>🏛️</span> Hub</a>
        <a href="mis-report.html" class="gov-nav-link active"><span>📊</span> MIS Report</a>
        <a href="rnr.html" class="gov-nav-link"><span>📋</span> RNR</a>
        <a href="raci.html" class="gov-nav-link"><span>🎯</span> RACI</a>
        <a href="kpi.html" class="gov-nav-link"><span>📈</span> KPI &amp; Incentive</a>
        <a href="training.html" class="gov-nav-link"><span>🎓</span> Training Kit</a>
      </nav>

      <div class="gov-bar-actions">
        <div class="gov-sync-badge" id="btnSyncGSheet" title="Click to refresh from Google Sheet">
          <span class="gov-sync-dot"></span>
          <span id="syncStatusText">GSheet Linked</span>
        </div>
        <button class="btn-gov btn-gov-gold no-print" id="btnDownloadPdf">📄 Download as PDF</button>
        <button class="btn-gov btn-gov-outline no-print" id="btnDownloadHtml">📥 Download HTML</button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="gov-main">
    <!-- DATE FILTER CONTROLS BAR -->
    <div class="filter-deck-bar no-print">
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <span style="font-weight:700; color:var(--svv-maroon); font-size:0.92rem;">Select Report Period:</span>
        <div class="filter-btn-group">
          <button class="filter-btn active" id="btnFilterThisMonth">This Month</button>
          <button class="filter-btn" id="btnFilterLastMonth">Last Month</button>
          <button class="filter-btn" id="btnFilterCustom">Custom Date Range</button>
          <button class="filter-btn" id="btnFilterAllTime">All Sheet Data (Live)</button>
        </div>
        <span id="liveDataSummaryBadge" class="gov-badge gov-badge-gold" style="font-size:0.8rem; font-weight:700; padding:6px 12px; border-radius:6px; display:inline-flex; align-items:center; gap:6px;">

      <!-- CUSTOM DATE RANGE INPUTS -->
      <div id="customDateWrap" style="display:none; align-items:center; gap:8px;">

      <div style="display:flex; gap:8px;">

      <div style="text-align:center; padding:60px 20px; color:#64748B;">
