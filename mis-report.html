<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suba Valli Vilas | Monthly Review Meeting (MRM) &amp; MIS Report</title>
  <link rel="icon" type="image/png" href="svv-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="governance-shared.css">
  <style>
    /* Executive C&B Deck Styling */
    .filter-deck-bar {
      background: #FFFFFF;
      border: 1px solid var(--svv-border-gold);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .filter-btn-group {
      display: inline-flex;
      background: #F4EFE6;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--svv-border-gold);
    }
    .filter-btn {
      border: none;
      background: transparent;
      padding: 7px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #555;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, var(--svv-maroon) 0%, #3F0202 100%);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(88, 5, 5, 0.2);
    }

    /* Page Canvas */
    .mis-page {
      background: #FFFFFF;
      border: 1px solid var(--svv-border);
      border-radius: 14px;
      padding: 36px 40px;
      margin-bottom: 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      position: relative;
    }
    .cover-page {
      background: linear-gradient(145deg, #1E293B 0%, #0F172A 100%);
      color: #FFFFFF;
      border: 2px solid var(--svv-gold);
      text-align: center;
      padding: 80px 40px;
    }
    .cover-card {
      max-width: 680px;
      margin: 0 auto;
    }
    .cover-crest img {
      width: 72px;
      height: 72px;
      background: #FFFFFF;
      border-radius: 14px;
      padding: 6px;
      border: 2px solid var(--svv-gold);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      margin-bottom: 16px;
    }
    .cover-brand {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      color: #FFFDF9;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .cover-tagline {
      font-size: 0.9rem;
      color: var(--svv-gold);
      letter-spacing: 1.5px;
      font-weight: 700;
    }
    .cover-divider {
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--svv-gold), transparent);
      margin: 24px auto;
    }
    .cover-title {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      color: #FFFFFF;
      margin-bottom: 10px;
    }
    .cover-period {
      font-size: 1.05rem;
      color: #E2E8F0;
      margin-bottom: 24px;
    }
    .cover-meta {
      font-size: 0.82rem;
      color: #94A3B8;
      line-height: 1.6;
    }

    /* Page Header */
    .page-top-hdr {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid var(--svv-gold);
      padding-bottom: 10px;
      margin-bottom: 22px;
    }
    .page-tag {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--svv-gold-dark);
    }
    .page-sec-title {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      color: var(--svv-maroon);
      margin: 0;
    }

    /* Summary Hero */
    .summary-hero-card {
      background: #FDFBF7;
      border: 1px solid var(--svv-border-gold);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 22px;
    }
    .health-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #15803D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(21, 128, 61, 0.15);
    }
    .health-num {
      font-size: 1.8rem;
      font-weight: 800;
      color: #15803D;
      line-height: 1;
    }
    .health-den {
      font-size: 0.72rem;
      color: var(--svv-muted);
    }
    .health-head {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      color: var(--svv-maroon);
      margin-bottom: 4px;
    }
    .health-sub {
      font-size: 0.9rem;
      color: var(--svv-muted);
    }

    /* Metric Grids */
    .metric-grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .metric-card {
      background: #FFFFFF;
      border: 1px solid var(--svv-border);
      border-radius: 10px;
      padding: 16px;
      border-top: 3px solid var(--svv-maroon);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .metric-card-green {
      border-top-color: #15803D;
    }
    .metric-card-amber {
      border-top-color: #D97706;
    }
    .metric-label {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--svv-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .metric-val {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--svv-text);
      margin: 4px 0 2px;
    }
    .metric-hint {
      font-size: 0.75rem;
      color: var(--svv-muted);
    }
    .metric-badge {
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 4px;
    }
    .badge-ok { color: #15803D; }
    .badge-alert { color: #B91C1C; }

    /* Wins / Attention */
    .wins-attention-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .wins-box {
      background: #F0FDF4;
      border: 1px solid #86EFAC;
      border-radius: 10px;
      padding: 16px 20px;
    }
    .wins-box h4 { color: #15803D; margin-bottom: 8px; font-size: 0.92rem; }
    .wins-box ul { padding-left: 20px; font-size: 0.86rem; color: #166534; line-height: 1.6; }

    .attention-box {
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      border-radius: 10px;
      padding: 16px 20px;
    }
    .attention-box h4 { color: #B91C1C; margin-bottom: 8px; font-size: 0.92rem; }
    .attention-box ul { padding-left: 20px; font-size: 0.86rem; color: #991B1B; line-height: 1.6; }

    /* Funnel */
    .funnel-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto 20px;
    }
    .funnel-step {
      background: #F8FAFC;
      border: 1.5px solid var(--svv-border);
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .funnel-step.highlight-step {
      background: #FFFDF9;
      border-color: var(--svv-gold);
    }
    .funnel-step-icon {
      font-size: 2rem;
    }
    .funnel-step-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--svv-muted);
      text-transform: uppercase;
    }
    .funnel-step-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--svv-maroon);
    }
    .funnel-step-sub {
      font-size: 0.78rem;
      color: var(--svv-muted);
    }
    .funnel-arrow {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--svv-gold-dark);
    }
    .funnel-alert-banner {
      background: #FFFBEB;
      border: 1px solid #FCD34D;
      border-radius: 8px;
      padding: 12px 18px;
      text-align: center;
      font-size: 0.9rem;
      color: #92400E;
      margin-top: 14px;
    }

    /* Strategy box */
    .strategic-box {
      background: #FFFBF2;
      border: 1px solid var(--svv-border-gold);
      border-left: 5px solid var(--svv-gold);
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 0.92rem;
      color: #451A03;
      line-height: 1.6;
    }

    /* Daily bars */
    .daily-bars-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .daily-bar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.84rem;
    }
    .daily-bar-label { width: 90px; font-weight: 600; color: #475569; }
    .daily-bar-track { flex: 1; height: 10px; background: #F1F5F9; border-radius: 5px; overflow: hidden; }
    .daily-bar-fill { height: 100%; background: linear-gradient(90deg, #580505 0%, #C5A059 100%); }
    .daily-bar-val { width: 50px; text-align: right; font-weight: 700; color: #1E293B; }

    /* Sentiment Tiles */
    .sentiment-cards-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .sentiment-tile {
      padding: 16px;
      border-radius: 10px;
      text-align: center;
    }
    .sentiment-green { background: #E8F8F0; border: 1px solid #86EFAC; color: #15803D; }
    .sentiment-neutral { background: #F8FAFC; border: 1px solid #CBD5E1; color: #334155; }
    .sentiment-red { background: #FEF2F2; border: 1px solid #FCA5A5; color: #B91C1C; }
    .sentiment-tile-title { font-size: 0.75rem; font-weight: 800; }
    .sentiment-tile-val { font-size: 2rem; font-weight: 800; margin: 4px 0; }
    .sentiment-tile-sub { font-size: 0.78rem; opacity: 0.85; }

    .voice-card {
      background: #FFFDF9;
      border-left: 3px solid var(--svv-gold);
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 12px;
      font-size: 0.88rem;
    }
    .voice-card p { margin: 4px 0 6px; font-style: italic; color: #334155; }

    .recovery-flow-card {
      background: #FAF8F5;
      border: 1px solid var(--svv-border-gold);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 650px;
      margin: 0 auto;
    }
    .recovery-step {
      background: #FFFFFF;
      border: 1px solid var(--svv-border);
      border-radius: 8px;
      padding: 14px 18px;
      text-align: center;
    }

    /* Print styles */
    @media print {
      body { background: #FFFFFF !important; }
      .gov-top-bar, .filter-deck-bar, .no-print { display: none !important; }
      .gov-main { padding: 0 !important; max-width: 100% !important; }
      .mis-page {
        border: none !important;
        box-shadow: none !important;
        padding: 20mm 15mm !important;
        page-break-after: always !important;
        min-height: 98vh;
      }
      .cover-page {
        background: #1E293B !important;
        color: #FFFFFF !important;
        -webkit-print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

  <!-- UNIFIED TOP NAVIGATION -->
  <header class="gov-top-bar">
    <div class="gov-bar-inner">
      <a href="crm-hub.html" class="gov-brand">
        <div class="gov-cb-badge" title="Consulting & Beyond (C&B)">
          <img src="cb-logo.png" alt="C&B Consulting & Beyond">
        </div>
        <div class="gov-logo-badge" title="Suba Valli Vilas Jewellery">
          <img src="svv-logo.png" alt="Suba Valli Vilas">
        </div>
        <div>
          <div class="gov-brand-title">SUBA VALLI VILAS</div>
          <div class="gov-brand-sub">CRM GOVERNANCE &amp; MANAGEMENT SUITE</div>
        </div>
      </a>

      <nav class="gov-nav-links">
        <a href="index.html" class="gov-nav-link nav-home"><span>🏠</span> Main App</a>
        <a href="crm-hub.html" class="gov-nav-link"><span>🏛️</span> Hub</a>
        <a href="mis-report.html" class="gov-nav-link active"><span>📊</span> MIS Report</a>
        <a href="rnr.html" class="gov-nav-link"><span>📋</span> RNR</a>
        <a href="raci.html" class="gov-nav-link"><span>🎯</span> RACI</a>
        <a href="kpi.html" class="gov-nav-link"><span>📈</span> KPI &amp; Incentive</a>
        <a href="training.html" class="gov-nav-link"><span>🎓</span> Training Kit</a>
      </nav>

      <div class="gov-bar-actions">
        <div class="gov-sync-badge" id="btnSyncGSheet" title="Click to refresh from Google Sheet">
          <span class="gov-sync-dot"></span>
          <span id="syncStatusText">GSheet Linked</span>
        </div>
        <button class="btn-gov btn-gov-gold no-print" id="btnDownloadPdf">📄 Download as PDF</button>
        <button class="btn-gov btn-gov-outline no-print" id="btnDownloadHtml">📥 Download HTML</button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="gov-main">
    <!-- DATE FILTER CONTROLS BAR -->
    <div class="filter-deck-bar no-print">
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <span style="font-weight:700; color:var(--svv-maroon); font-size:0.92rem;">Select Report Period:</span>
        <div class="filter-btn-group">
          <button class="filter-btn active" id="btnFilterThisMonth">This Month (Oct 2026)</button>
          <button class="filter-btn" id="btnFilterLastMonth">Last Month (Sept 2026 Audit)</button>
          <button class="filter-btn" id="btnFilterCustom">Custom Date Range</button>
        </div>
      </div>

      <!-- CUSTOM DATE RANGE INPUTS -->
      <div id="customDateWrap" style="display:none; align-items:center; gap:8px;">
        <input type="date" id="customStartDate" class="gov-input" style="padding:6px 10px;">
        <span>to</span>
        <input type="date" id="customEndDate" class="gov-input" style="padding:6px 10px;">
        <button class="btn-gov btn-gov-primary btn-sm" id="btnApplyCustomDate">Apply Filter</button>
      </div>

      <div style="display:flex; gap:8px;">
        <button class="btn-gov btn-gov-primary btn-sm" onclick="window.print()">🖨️ Print Report</button>
      </div>
    </div>

    <!-- DYNAMIC REPORT PAGES CONTAINER -->
    <div id="misReportContent">
      <!-- Rendered dynamically by mis-report.js -->
    </div>
  </main>

  <!-- TOAST -->
  <div id="govToast" class="gov-toast"></div>

  <script src="mis-report.js"></script>
</body>
</html>
